<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lista de Mercado</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#7c4dbd">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f6f1fb;--card:#fff;--tx:#2b2236;--mut:#7d7189;--ac:#7c4dbd;--ok:#2e9e62;--bad:#d64545;--ln:#e6dcf1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17131d;--card:#231d2c;--tx:#f0eaf7;--mut:#a398b3;--ac:#b48cf0;--ok:#4cc68a;--bad:#f07a7a;--ln:#372d45}}
:root[data-theme="dark"]{--bg:#17131d;--card:#231d2c;--tx:#f0eaf7;--mut:#a398b3;--ac:#b48cf0;--ok:#4cc68a;--bad:#f07a7a;--ln:#372d45}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:640px;margin:0 auto;padding-bottom:40px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:12px 14px 8px;z-index:5;border-bottom:1px solid var(--ln)}
.top{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.top select{flex:1;width:auto;font-size:16px;font-weight:600;padding:8px}
.btn{border:0;background:var(--ac);color:#fff;border-radius:9px;padding:9px 12px;font-size:14px;font-weight:600}
.btn.alt{background:var(--card);color:var(--tx);border:1px solid var(--ln)}
.tot{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.box{background:var(--card);border-radius:12px;padding:8px 10px;border:1px solid var(--ln)}
.box small{color:var(--mut);display:block;font-size:11px}.box b{font-size:18px}.box.ok b{color:var(--ok)}
.bar{height:6px;background:var(--ln);border-radius:9px;margin:8px 0 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0}
.tabs{display:flex;gap:6px;margin-top:8px}
.tabs button{flex:1;padding:7px 2px;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:9px;font-size:13px}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
h2{font-size:15px;margin:18px 14px 6px;display:flex;justify-content:space-between;color:var(--ac)}
h2 span{color:var(--mut);font-weight:400;font-size:12px}
.it{background:var(--card);border:1px solid var(--ln);border-radius:12px;margin:6px 14px;padding:10px}
.r1{display:flex;align-items:center;gap:10px}
.r2{display:flex;align-items:center;gap:8px;margin:8px 0 0 36px;flex-wrap:wrap}
.ck{width:26px;height:26px;accent-color:var(--ok);flex:none}
.nm{flex:1;font-size:16px;font-weight:600}
.it.got .nm{text-decoration:line-through;color:var(--mut)}
.it.got{background:color-mix(in srgb,var(--ok) 10%,var(--card))}
.it.no{opacity:.5}
input[type=number],input[type=text],input[type=date],select{background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:6px;font-size:15px;width:72px}
.qt,.pr{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--mut)}
.qt select{width:74px}.pr input{width:78px}
.need{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:13px}
.need input{width:20px;height:20px;accent-color:var(--ac)}
.del{border:0;background:none;color:var(--mut);font-size:20px;padding:0 4px}
.add{background:var(--card);border:1px solid var(--ln);border-radius:14px;margin:20px 14px;padding:12px}
.add h3{margin:0 0 8px;font-size:15px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g input,.g select{width:100%}.full{grid-column:1/3}
.g .btn{grid-column:1/3;padding:11px;font-size:16px}
.foot{text-align:center;margin:10px 14px}
.foot button{border:1px solid var(--ln);background:var(--card);color:var(--mut);border-radius:9px;padding:8px 12px;margin:3px;font-size:13px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.md{background:var(--card);border-radius:16px;padding:16px;width:100%;max-width:420px;border:1px solid var(--ln)}
.md h3{margin:0 0 4px}.md p{margin:0 0 12px;color:var(--mut);font-size:14px}
.md .btn{width:100%;margin-top:8px;padding:12px;font-size:15px}
.md hr{border:0;border-top:1px solid var(--ln);margin:14px 0}
.md label{font-size:12px;color:var(--mut);display:block;margin:6px 0 2px}.md input,.md select{width:100%}
.sb{display:flex;align-items:center;gap:8px;margin:5px 14px;font-size:13px}
.sb .l{width:84px;color:var(--mut)}.sb .t{flex:1;height:18px;background:var(--ln);border-radius:6px;overflow:hidden}
.sb .t i{display:block;height:100%;background:var(--ac)}.sb .v{width:96px;text-align:right}
.cmp{margin:6px 14px;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px}
.cmp b{font-size:15px}
.ch{display:flex;gap:6px;overflow-x:auto;margin-top:6px;padding-bottom:2px}
.c{flex:none;border:1px solid var(--ln);border-radius:9px;padding:5px 8px;font-size:12px;min-width:104px}
.c small{color:var(--mut);display:block}
.up{color:var(--bad)}.dn{color:var(--ok)}
.sub{font-size:13px;font-weight:700;color:var(--ok)}
.md textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:8px;font-size:12px}
.hint{margin:10px 14px;color:var(--mut);font-size:13px}
</style>
</head>
<body>
<header>
  <div class="top"><select id="sel"></select><button class="btn" id="nova">+ Nova</button><button class="btn alt" id="dl2" aria-label="Apagar esta lista">🗑</button></div>
  <div id="tots">
    <div class="tot">
      <div class="box"><small>Total previsto (o que preciso)</small><b id="t1">R$ 0</b></div>
      <div class="box ok"><small>Já no carrinho</small><b id="t2">R$ 0</b></div>
    </div>
    <div class="bar"><i id="pg"></i></div>
  </div>
  <div class="tabs">
    <button data-f="all" class="on">Todos</button><button data-f="falta">Falta</button><button data-f="peguei">Peguei</button><button data-f="cmp">📊 Comparar</button>
  </div>
</header>
<main id="main"></main>
<section class="add" id="addbox">
  <h3>➕ Adicionar item</h3>
  <div class="g">
    <input class="full" type="text" id="aN" placeholder="Nome do item">
    <input type="number" id="aQ" placeholder="Quantidade" inputmode="decimal" step="any">
    <select id="aU"></select>
    <input type="number" id="aP" placeholder="R$ por unidade" inputmode="decimal" step="any">
    <select id="aC"></select>
    <button class="btn" id="aB">Adicionar</button>
  </div>
</section>
<div class="foot" id="foot"><button id="clr">Desmarcar tudo</button><button id="dl">Apagar esta lista</button><button id="ex">Exportar listas</button><button id="im">Importar listas</button></div>
<div id="modal"></div>

<script>
var CATS=["Alimentos","Hortifruti","Limpeza / Higiene"],UN=["kg","g","L","ml","un","pct","cabeças","latas","rolos","pés","maços"];
var KEY="mercado-v2",D={lists:[],cur:null},F="all",uid=Date.now();
function nid(){return ++uid}
function base(){var a=[["Arroz",5,"kg",25],["Feijão",3,"kg",30],["Frango (coxas/sobrecoxas)",4,"kg",80],["Carne (patinho)",2,"kg",70],["Ovos",30,"un",28],["Leite",12,"L",72],["Pão de forma",4,"pct",40],["Macarrão",4,"pct",24],["Café",1,"kg",45],["Açúcar",2,"kg",10],["Sal",1,"kg",4],["Óleo de soja",2,"un",18],["Molho de tomate",6,"un",18],["Alho",2,"cabeças",6],["Cebola",2,"kg",8],["Farinha de trigo",1,"kg",6],["Margarina/Manteiga",500,"g",12],["Queijo muçarela",500,"g",28],["Presunto",500,"g",16],["Sardinha em lata",6,"un",18],["Milho verde",2,"latas",6],["Biscoito cream cracker",3,"pct",12],["Aveia",500,"g",10]];
var h=[["Banana",2,"kg"],["Maçã",2,"kg"],["Laranja",2,"kg"],["Limão",10,"un"],["Tomate",2,"kg"],["Batata",3,"kg"],["Cenoura",2,"kg"],["Cebola",2,"kg"],["Alface",4,"pés"],["Couve",2,"maços"],["Pimentão",4,"un"],["Pepino",2,"un"],["Abobrinha",2,"un"]];
var l=[["Papel higiênico",16,"rolos"],["Sabonete",4,"un"],["Pasta de dente",2,"un"],["Shampoo",2,"un"],["Condicionador",2,"un"],["Detergente",4,"un"],["Sabão em pó",2,"kg"],["Amaciante",2,"L"],["Desinfetante",2,"L"],["Sabão em barra",5,"un"],["Saco de lixo (100 L)",1,"pct"]];
var o=[];function p(arr,c){arr.forEach(function(x){o.push({id:nid(),n:x[0],q:x[1],u:x[2],p:x[3]?Math.round(x[3]/x[1]*10000)/10000:0,c:c,got:false,need:true})})}
p(a,0);p(h,1);p(l,2);return o}
function pad(n){return n<10?"0"+n:""+n}
function today(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function fd(s){var x=s.split("-");return x[2]+"/"+x[1]+"/"+x[0]}
function money(v){v=Math.round(v*100)/100;return "R$ "+v.toLocaleString("pt-BR",{minimumFractionDigits:v%1?2:0,maximumFractionDigits:2})}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function cur(){return D.lists.find(function(x){return x.id===D.cur})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
try{var r=localStorage.getItem(KEY);if(r)D=JSON.parse(r);else{var old=localStorage.getItem("mercado-v1");if(old){var it=JSON.parse(old);if(it&&it.length){var id=nid();D={lists:[{id:id,date:today(),items:it}],cur:id}}}}}catch(e){}
D.lists.forEach(function(l){if(!l.ppu){l.items.forEach(function(i){if(+i.q>0)i.p=Math.round((+i.p||0)/i.q*10000)/10000});l.ppu=true}});
function T(i){return (+i.q||0)*(+i.p||0)}
function sorted(){return D.lists.slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:a.id-b.id})}
function newList(date,mode){
 var items=[];
 if(mode==="prev"&&D.lists.length){var pv=sorted().pop();items=pv.items.map(function(i){var c=JSON.parse(JSON.stringify(i));c.id=nid();c.got=false;c.need=true;return c})}
 else if(mode==="base")items=base();
 var l={id:nid(),date:date||today(),items:items,ppu:true};D.lists.push(l);D.cur=l.id;save();render()}
function conv(q,u){if(u==="g")return{q:q/1000,u:"kg"};if(u==="ml")return{q:q/1000,u:"L"};return{q:q,u:u}}
function ask(msg,fn){var m=document.getElementById("modal");m.innerHTML='<div class="ov"><div class="md"><h3>Confirmar</h3><p>'+esc(msg)+'</p><button class="btn" id="ay" style="background:var(--bad)">Sim, apagar</button><button class="btn alt" id="an">Cancelar</button></div></div>';document.getElementById("an").onclick=function(){m.innerHTML=""};document.getElementById("ay").onclick=function(){m.innerHTML="";fn()}}
function modal(first){
 var h='<div class="ov"><div class="md"><h3>'+(first?"Vamos começar 🛒":"Lista de mercado")+'</h3>';
 if(!first){var c=cur();h+='<p>É uma lista nova ou continua a anterior?</p><button class="btn" id="mc">Continuar lista de '+fd(c.date)+'</button><hr>'}
 else h+='<p>Crie sua primeira lista.</p>';
 h+='<label>Data da nova lista</label><input type="date" id="md" value="'+today()+'"><label>Começar com</label><select id="mm">'+
 (first?'':'<option value="prev">Itens da lista anterior (sem marcações)</option>')+'<option value="base">Lista original (30 dias, 2 pessoas)</option><option value="empty">Lista vazia</option></select>'+
 '<button class="btn" id="mn">Criar nova lista</button></div></div>';
 var m=document.getElementById("modal");m.innerHTML=h;
 var c2=document.getElementById("mc");if(c2)c2.onclick=function(){m.innerHTML=""};
 document.getElementById("mn").onclick=function(){var d=document.getElementById("md").value||today(),mo=document.getElementById("mm").value;m.innerHTML="";newList(d,mo)}}
function render(){
 var s=document.getElementById("sel");
 s.innerHTML=sorted().reverse().map(function(l){return '<option value="'+l.id+'"'+(l.id===D.cur?" selected":"")+'>'+fd(l.date)+' ('+l.items.length+' itens)</option>'}).join("");
 var cmp=F==="cmp";
 ["tots","addbox","foot"].forEach(function(k){document.getElementById(k).style.display=cmp?"none":""});
 document.querySelectorAll(".tabs button").forEach(function(b){b.classList.toggle("on",b.dataset.f===F)});
 if(cmp)return renderCmp();
 var L=cur();if(!L){document.getElementById("main").innerHTML="";return}
 var t1=0,t2=0,n=0,g=0,h="";
 L.items.forEach(function(i){if(i.need){t1+=T(i);n++;if(i.got){t2+=T(i);g++}}});
 document.getElementById("t1").textContent=money(t1);document.getElementById("t2").textContent=money(t2);
 document.getElementById("pg").style.width=(n?g/n*100:0)+"%";
 CATS.forEach(function(cn,ci){
  var its=L.items.filter(function(i){return i.c===ci&&(F==="all"||(F==="falta"&&i.need&&!i.got)||(F==="peguei"&&i.got))});
  if(!its.length)return;var sub=0;its.forEach(function(i){if(i.need)sub+=T(i)});
  h+='<h2>'+cn+'<span>'+money(sub)+'</span></h2>';
  its.forEach(function(i){
   var uo=UN.indexOf(i.u)<0?UN.concat([i.u]):UN;
   h+='<div class="it'+(i.got?' got':'')+(i.need?'':' no')+'" data-id="'+i.id+'"><div class="r1"><input class="ck" type="checkbox" data-a="got"'+(i.got?' checked':'')+' aria-label="Peguei"><div class="nm">'+esc(i.n)+'</div><button class="del" data-a="del" aria-label="Remover">✕</button></div>'+
   '<div class="r2"><label class="qt"><input type="number" step="any" inputmode="decimal" data-a="q" value="'+i.q+'"><select data-a="u">'+uo.map(function(u){return '<option'+(u===i.u?' selected':'')+'>'+esc(u)+'</option>'}).join("")+'</select></label>'+
   '<label class="pr">R$/'+esc(i.u)+' <input type="number" step="any" inputmode="decimal" data-a="p" value="'+(i.p||"")+'" placeholder="0"></label><span class="sub">= '+money(T(i))+'</span>'+
   '<label class="need"><input type="checkbox" data-a="need"'+(i.need?' checked':'')+'> Preciso</label></div></div>'});
 });
 document.getElementById("main").innerHTML=h||'<p class="hint" style="text-align:center">Nada por aqui 🎉</p>'}
function renderCmp(){
 var ls=sorted().slice(-6),h="";
 if(ls.length<2)h+='<p class="hint">Crie pelo menos 2 listas com valores para comparar os meses.</p>';
 h+='<h2>Total por lista<span>itens que preciso</span></h2>';
 var tt=ls.map(function(l){return l.items.reduce(function(a,i){return a+(i.need?T(i):0)},0)}),mx=Math.max.apply(null,tt.concat([1]));
 ls.forEach(function(l,k){var v=tt[k],d="";if(k>0&&tt[k-1]>0){var pc=(v/tt[k-1]-1)*100;d=' <span class="'+(pc>0?"up":"dn")+'">'+(pc>0?"▲":"▼")+Math.abs(pc).toFixed(0)+'%</span>'}
  h+='<div class="sb"><span class="l">'+fd(l.date).slice(0,5)+"/"+l.date.slice(2,4)+'</span><span class="t"><i style="width:'+(v/mx*100)+'%"></i></span><span class="v">'+money(v)+d+'</span></div>'});
 var M={};
 ls.forEach(function(l){l.items.forEach(function(i){if(!i.need||!(+i.p>0)||!(+i.q>0))return;var k=i.n.trim().toLowerCase(),c=conv(+i.q,i.u);(M[k]=M[k]||{n:i.n,e:[]}).e.push({d:l.date,up:i.p/conv(1,i.u).q,u:c.u,q:i.q,qu:i.u,p:T(i)})})});
 var keys=Object.keys(M).sort();
 h+='<h2>Preço por item<span>R$ por kg / L / un</span></h2>';
 if(!keys.length)h+='<p class="hint">Preencha os valores dos itens para ver a comparação.</p>';
 keys.forEach(function(k){var e=M[k].e;
  h+='<div class="cmp"><b>'+esc(M[k].n)+'</b><div class="ch">'+e.map(function(x,j){var d="";if(j>0&&e[j-1].u===x.u){var pc=(x.up/e[j-1].up-1)*100;if(Math.abs(pc)>=0.5)d=' <span class="'+(pc>0?"up":"dn")+'">'+(pc>0?"▲":"▼")+Math.abs(pc).toFixed(0)+'%</span>'}
   return '<div class="c"><small>'+fd(x.d).slice(0,5)+"/"+x.d.slice(2,4)+'</small><b>'+money(x.up)+'/'+esc(x.u)+'</b>'+d+'<small>'+x.q+' '+esc(x.qu)+' · '+money(x.p)+'</small></div>'}).join("")+'</div></div>'});
 document.getElementById("main").innerHTML=h}
function find(el){var d=el.closest(".it"),L=cur();return d&&L?L.items.find(function(i){return i.id==d.dataset.id}):null}
var M=document.getElementById("main");
M.addEventListener("change",function(e){var i=find(e.target),a=e.target.dataset.a;if(!i)return;var v=e.target;
 if(a==="got")i.got=v.checked;else if(a==="need")i.need=v.checked;else if(a==="q")i.q=parseFloat(v.value)||0;else if(a==="u")i.u=v.value;else if(a==="p")i.p=parseFloat(v.value)||0;
 save();render()});
M.addEventListener("click",function(e){if(e.target.dataset.a==="del"){var i=find(e.target),L=cur();L.items=L.items.filter(function(x){return x!==i});save();render()}});
document.querySelectorAll(".tabs button").forEach(function(b){b.onclick=function(){F=b.dataset.f;render()}});
document.getElementById("sel").onchange=function(){D.cur=+this.value;save();render()};
document.getElementById("nova").onclick=function(){D.lists.length?modal(false):modal(true)};
var su=document.getElementById("aU");su.innerHTML=UN.map(function(u){return "<option>"+u+"</option>"}).join("");
var sc=document.getElementById("aC");sc.innerHTML=CATS.map(function(c,i){return '<option value="'+i+'">'+c+'</option>'}).join("");
document.getElementById("aB").onclick=function(){var n=document.getElementById("aN").value.trim(),L=cur();if(!n||!L)return;
 L.items.push({id:nid(),n:n,q:parseFloat(document.getElementById("aQ").value)||1,u:su.value,p:parseFloat(document.getElementById("aP").value)||0,c:+sc.value,got:false,need:true});
 ["aN","aQ","aP"].forEach(function(k){document.getElementById(k).value=""});save();render()};
document.getElementById("clr").onclick=function(){ask("Desmarcar todos os itens pegos?",function(){cur().items.forEach(function(i){i.got=false});save();render()})};
document.getElementById("dl").onclick=function(){ask("Apagar a lista de "+fd(cur().date)+"? Ela some também da comparação.",function(){D.lists=D.lists.filter(function(x){return x.id!==D.cur});D.cur=D.lists.length?sorted().pop().id:null;save();if(D.cur)render();else{render();modal(true)}})};
function dataModal(title,hint,val,label,fn){var m=document.getElementById("modal");
 m.innerHTML='<div class="ov"><div class="md"><h3>'+title+'</h3><p id="dh">'+hint+'</p><textarea id="dt" rows="8"></textarea><button class="btn" id="db">'+label+'</button><button class="btn alt" id="dc">Fechar</button></div></div>';
 var t=document.getElementById("dt");t.value=val;document.getElementById("dc").onclick=function(){m.innerHTML=""};
 document.getElementById("db").onclick=function(){fn(t)}}
document.getElementById("ex").onclick=function(){dataModal("Exportar listas","Toque em Copiar e cole em um lugar seguro (ex.: Notas ou WhatsApp para você mesma).",JSON.stringify(D),"Copiar",function(t){t.focus();t.select();try{document.execCommand("copy")}catch(e){}try{navigator.clipboard.writeText(t.value)}catch(e){}document.getElementById("dh").textContent="Copiado! Se não copiou, mantenha o dedo no texto e escolha Copiar."})};
document.getElementById("im").onclick=function(){dataModal("Importar listas","Cole aqui o texto exportado. As listas serão somadas às que você já tem.","","Importar",function(t){var o;try{o=JSON.parse(t.value)}catch(e){}
 if(!o||!Array.isArray(o.lists)){document.getElementById("dh").textContent="Texto inválido. Cole o conteúdo completo da exportação.";return}
 o.lists.forEach(function(l){if(!D.lists.some(function(x){return x.id===l.id})){l.ppu=true;D.lists.push(l)}});
 if(o.lists.length)D.cur=o.lists[o.lists.length-1].id;if(!cur())D.cur=D.lists[0].id;save();document.getElementById("modal").innerHTML="";render()})};
document.getElementById("dl2").onclick=document.getElementById("dl").onclick;
if(!D.lists.length||!cur()){if(D.lists.length)D.cur=sorted().pop().id;render();if(!D.lists.length)modal(true)}else{render();modal(false)}
if("serviceWorker" in navigator&&/^https?:/.test(location.protocol)&&location.hostname.indexOf("claude")<0){try{navigator.serviceWorker.register("sw.js").catch(function(){})}catch(e){}}
</script>
</body>
</html>
